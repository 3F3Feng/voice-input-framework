name: CI

on:
  push:
    branches: [main, review/architecture-notes]
  # 不限定 base 分支:任何 PR 都要跑测试。此前只监听 base=main 的 PR,
  # 导致面向长期分支(如 review/architecture-notes)的 PR 一个 job 都不触发。
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 和 pyproject.toml 的 requires-python(>=3.11,<3.13)一致。以前还测 3.10,
        # 可 3.10 上根本装不上这个项目(shared/version_check.py 也会直接拒绝),
        # 为它保持兼容只是白费力气;要改支持范围就两处一起改。
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pynput httpx numpy pydantic websockets uvicorn fastapi pytest-asyncio python-multipart

      - name: Run tests (Ubuntu with Xvfb)
        if: matrix.os == 'ubuntu-latest'
        run: |
          xvfb-run --auto-servernum pytest tests/ -v --tb=short -m "not integration"

      - name: Run tests
        if: matrix.os != 'ubuntu-latest'
        run: |
          pytest tests/ -v --tb=short -m "not integration"

      - name: Run linting
        run: |
          pip install black ruff
          # F 类(未定义/未使用等真实错误)严格;扩展风格规则为既有债务,渐进清理
          ruff check client/ server/ shared/ tests/ services/ --select F

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install black ruff mypy

      - name: Run black
        run: |
          # 核心模块格式检查(既有旧客户端文件债务待后续清理)
          black --check services/ shared/ tests/ client/network.py client/app.py client/config_manager.py

      - name: Run ruff
        run: |
          # F 类真实错误严格(无 || true);风格规则为既有债务
          ruff check client/ server/ shared/ tests/ services/ --select F

  setup-env:
    # 建环境脚本本身没人测过:Windows 的 .ps1 在开发机(macOS)上根本跑不了,
    # `-Llm` 在没有 C++ 工具链的 Windows 上必失败这件事,是用户实测才发现的。
    # 这里在干净的 runner 上真跑一遍,重点是 LLM 后处理(llama.cpp)那一段:
    # 有显卡装显卡版、装完加载不了依次退回(cuda → vulkan → cpu)。runner 没有显卡,
    # 所以:
    #   - Windows:放一个假的 nvidia-smi,让脚本以为有 NVIDIA 显卡 → 装 CUDA 版 →
    #     没有驱动加载不了 → 退回。和用户的 N 卡机器走的是同一条路,只差最后成功那一步。
    #   - Linux:装上软件实现的 Vulkan(lavapipe),手动指定 vulkan 版,真的用它跑一次
    #     推理——证明 Vulkan 版的包能加载、能出字(速度当然不算数)。
    name: setup-env on ${{ matrix.os }} (LLM backend selection)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # ── Linux ──
      - name: Install a software Vulkan driver (lavapipe)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers

      - name: setup-env.sh (auto, no GPU on the runner -> CPU build of llama.cpp)
        if: runner.os == 'Linux'
        run: |
          # 不带任何参数:llama.cpp 是默认就装的(语音识别和 LLM 后处理都跑在它上面)。
          scripts/setup-env.sh --backend cpu
          cat .venv/vif-llm-backend
          grep -q '"requested": "auto", "installed": "cpu"' .venv/vif-llm-backend

      - name: Vulkan build without a real GPU is rejected (software rendering doesn't count)
        if: runner.os == 'Linux'
        run: |
          # 只有 lavapipe、不点名设备:Vulkan 版装得上,但 llama.cpp 认不出显卡,脚本应该
          # 判它「用不了」。手动指定时不再往下退,所以落在 none。
          scripts/setup-env.sh --backend cpu --llm-backend vulkan
          cat .venv/vif-llm-backend
          grep -q '"requested": "vulkan", "installed": "none"' .venv/vif-llm-backend

      - name: setup-env.sh --llm-backend vulkan (runs on lavapipe)
        if: runner.os == 'Linux'
        # llama.cpp 的 Vulkan 版**故意不认** CPU 类型的 Vulkan 设备(lavapipe 就是):只有
        # 软件渲染时它报「No devices found」。对用户是好事——没有显卡的 Linux 桌面不会被
        # 当成有显卡。这里要测的是 Vulkan 这条路本身,所以点名用第 0 块设备。
        env:
          GGML_VK_VISIBLE_DEVICES: "0"
        run: |
          scripts/setup-env.sh --backend cpu --llm-backend vulkan
          cat .venv/vif-llm-backend
          grep -q '"requested": "vulkan", "installed": "vulkan"' .venv/vif-llm-backend

      - name: Vulkan build really generates text
        if: runner.os == 'Linux'
        env:
          GGML_VK_VISIBLE_DEVICES: "0"
        run: |
          .venv/bin/python - <<'PY'
          import llama_cpp
          from huggingface_hub import hf_hub_download

          assert llama_cpp.llama_supports_gpu_offload(), "the Vulkan build sees no device"
          # 1 MB 的玩具模型:要验证的是「模型放到 Vulkan 设备上能生成」,不是质量。
          path = hf_hub_download("ggml-org/models", "tinyllamas/stories260K.gguf")
          llm = llama_cpp.Llama(model_path=path, n_ctx=256, n_gpu_layers=-1, verbose=True)
          out = llm("Once upon a time", max_tokens=16)["choices"][0]["text"]
          print("generated:", repr(out))
          assert out.strip(), "nothing was generated"
          PY

      # ── Windows ──
      - name: setup-env.ps1 with a fake NVIDIA card (cuda -> vulkan -> cpu)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # 假的 nvidia-smi:脚本会以为有 NVIDIA 显卡,PyTorch 装 CUDA 版、llama.cpp 先试
          # CUDA 版——和用户的 N 卡机器走的是同一条路。
          $fake = Join-Path $env:RUNNER_TEMP "fake-nvidia"
          New-Item -ItemType Directory -Force $fake | Out-Null
          Set-Content -Path (Join-Path $fake "nvidia-smi.cmd") -Value "@exit /b 0" -Encoding ASCII
          $env:Path = "$fake;$env:Path"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\setup-env.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $marker = Get-Content .venv\vif-llm-backend -Raw
          Write-Host "marker: $marker"
          # CUDA 版在没有驱动的 runner 上一定用不了;最后落在哪一个取决于 runner 上有没有
          # Vulkan 运行库,但必须落在一个真能用的上面。
          if ($marker -notmatch '"requested": "auto", "installed": "(vulkan|cpu)"') {
            Write-Error "unexpected marker: $marker"; exit 1
          }

      - name: CUDA runtime from PyTorch is reachable for llama.cpp
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # CUDA 版的 llama.cpp 要 cudart64_12.dll / cublas64_12.dll(包里不带),我们指给它
          # PyTorch CUDA 版带的那份(shared/llama_runtime.py)。runner 没有显卡驱动,
          # 验证不了整条链,但这两个库按名字加载得到——剩下缺的就只有驱动里的 nvcuda.dll。
          .venv/Scripts/python.exe - <<'PY'
          import ctypes
          from shared import llama_runtime

          used = llama_runtime.prepare()
          print("dirs:", used)
          assert used, "no CUDA runtime directory found next to torch"
          for name in ("cudart64_12.dll", "cublas64_12.dll"):
              ctypes.WinDLL(name)
              print("loaded", name)
          PY

      - name: Visual C++ runtime check reads the msvcp140.dll llama.cpp really uses
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # 运行库太旧的机器上 llama.cpp 一调用就崩(见 shared/llama_runtime.py 的
          # MIN_MSVC_RUNTIME),建环境脚本靠这个检查把它认出来。runner 上的运行库是新的,
          # 这里验证的是「问得到、读得出版本」——问不到时检查会悄悄放行。
          .venv/Scripts/python.exe - <<'PY'
          from shared import llama_runtime

          llama_runtime.prepare()
          import llama_cpp

          runtime = llama_runtime.msvc_runtime()
          print("runtime:", runtime)
          assert runtime is not None, "could not find the loaded msvcp140.dll"
          assert not runtime.too_old, runtime
          # 脚本用 uv 自己管理的 Python 建环境:它的目录里没有 msvcp140.dll,所以加载到的
          # 必须是系统那份(Anaconda 的 Python 自带一份旧的,会抢在前面)。
          assert runtime.from_system, runtime
          import sys
          print("python :", sys.base_prefix)
          assert "uv" in sys.base_prefix.lower().split("\\"), sys.base_prefix
          PY

      # ── 两边都要:下载进度的计数在真下载上数得准 ──
      - name: Download meter counts a real HuggingFace download
        shell: bash
        env:
          # 干净的缓存:前面的步骤可能已经下过同一个文件,那样这里一个字节都不会再下。
          HF_HOME: ${{ runner.temp }}/hf-meter
        run: |
          # 界面上的下载进度接在 huggingface_hub 的进度回调上(services/model_catalog.py)。
          # 新建的环境装到的是最新的 huggingface_hub,而它报进度的方式变过(2.x 一个文件报
          # 两条:网络上收到的、写进文件的;加在一起就是文件大小的 1.5~1.9 倍)——开发机
          # 上的旧环境看不出来。所以在这里对着真下载核对:数出来的要正好等于文件大小。
          if [ -x .venv/Scripts/python.exe ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" - <<'PY'
          import os
          import huggingface_hub
          from huggingface_hub import hf_hub_download
          from services import model_catalog as mc

          print("huggingface_hub", huggingface_hub.__version__)
          assert mc.install_download_meter(), "could not hook huggingface_hub's progress"
          meter = mc.DOWNLOAD_METER
          for name in ("tinyllamas/stories260K.gguf", "tinyllamas/stories15M-q4_0.gguf"):
              start = meter.snapshot()
              path = hf_hub_download("ggml-org/models", name)
              written, transferred = (now - then for now, then in zip(meter.snapshot(), start))
              counted, size = meter.since(start), os.path.getsize(path)
              print(f"{name}: counted {counted} (written {written}, transferred {transferred}), file is {size}")
              assert counted == size, (name, counted, size)
              assert transferred <= size, (name, transferred, size)
      # ── 两边都要:量化版 Qwen3-ASR 在这个环境里真的认得出话 ──
      - name: Quantized Qwen3-ASR transcribes real speech
        shell: bash
        env:
          # Linux 上这一步跑在软件实现的 Vulkan 上(见上);Windows 的 runner 没有显卡,跑 CPU。
          GGML_VK_VISIBLE_DEVICES: "0"
          # 档位的说明是中文的;Windows 的控制台默认代码页打不出来。
          PYTHONUTF8: "1"
        run: |
          # 非 Apple 平台上默认的识别模型(services/qwen_asr_gguf.py)。音频是经 llama.cpp 的
          # 多模态库送进去的,开发机(macOS)上验证不了 Windows / Linux 的包里这条路通不通。
          # 顺便把这台机器被分到哪一档、识别花了多久打出来——runner 是 4 核的普通 x86,
          # 正好当「没有显卡的机器」的速度参考。
          if [ -x .venv/Scripts/python.exe ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" - <<'PY'
          import time, wave
          import numpy as np
          from huggingface_hub import hf_hub_download
          from services import hardware
          from services.qwen_asr_gguf import QwenASRGguf
          from shared.model_registry import MODELS_CONFIG

          devices = hardware.llama_devices()
          print("devices:", devices)
          # 设备表至少得有 CPU 那一项:问不到(函数找不到、库加载不了)就是空的。
          assert devices, "could not list llama.cpp devices"
          print("machine:", hardware.machine())
          print("plan   :", hardware.current_plan())

          info = MODELS_CONFIG["qwen_asr_small"]
          t = time.time()
          engine = QwenASRGguf(info["model_id"], info["gguf_file"], info["mmproj_file"])
          print(f"loaded on {engine.accelerator} in {time.time() - t:.1f}s; note: {engine.accelerator_note}")

          clip = hf_hub_download("bezzam/audio_samples", "librispeech_mr_quilter.wav", repo_type="dataset")
          with wave.open(clip) as w:
              assert (w.getnchannels(), w.getsampwidth(), w.getframerate()) == (1, 2, 16000)
              audio = np.frombuffer(w.readframes(w.getnframes()), dtype="<i2").astype(np.float32) / 32768
          seconds = len(audio) / 16000
          for language in (None, "English"):
              t = time.time()
              text, spoken = engine.transcribe(audio, 16000, language)
              took = time.time() - t
              print(f"language={language}: {seconds:.1f}s of audio in {took:.2f}s (x{took / seconds:.2f} realtime) -> {spoken}: {text}")
              assert "quilter" in text.lower() and "gospel" in text.lower(), text
          assert spoken is None  # 指定了语言时模型不再报语言
          engine.close()
          PY

      # ── 两边都要:装出来的环境里 LLM 后处理的后端真的可用 ──
      - name: LLM backend is usable in the environment it built
        shell: bash
        run: |
          # 脚本在 LLM 依赖装不上时会退回「不带它」并以 0 退出,所以光看退出码不够,
          # 要确认 llama_cpp 真的能 import、后端选得出来。
          if [ -x .venv/Scripts/python.exe ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" - <<'PY'
          import llama_cpp, torch
          from shared import llm_backend

          backend, why = llm_backend.choose_backend(False)
          assert (backend, why) == ("llamacpp", None), (backend, why)
          print("llama_cpp", llama_cpp.__version__, "| torch", torch.__version__)
          print("gpu offload:", llama_cpp.llama_supports_gpu_offload())
          PY

  rust-logic:
    name: Rust STT client logic tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run stt-logic-tests (no tauri/system deps needed)
        run: |
          cd gui/stt-logic-tests
          cargo test

  pyright:
    name: Pyright type check (client app contract)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps (for import resolution)
        run: |
          pip install --upgrade pip
          pip install PySimpleGUI pynput sounddevice numpy pyautogui

      - name: Run pyright on client app
        run: |
          npx -y pyright@latest client/app.py client/network.py 2>&1 \
            | grep -E "error:" \
            | grep -vE "reportMissingImports|reportMissingModuleSource|reportOptionalMemberAccess|reportUnknown" \
            && exit 1 || exit 0
