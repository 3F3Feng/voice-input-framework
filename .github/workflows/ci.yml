name: CI

on:
  push:
    branches: [main, review/architecture-notes]
  # 不限定 base 分支:任何 PR 都要跑测试。此前只监听 base=main 的 PR,
  # 导致面向长期分支(如 review/architecture-notes)的 PR 一个 job 都不触发。
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 和 pyproject.toml 的 requires-python(>=3.11,<3.13)一致。以前还测 3.10,
        # 可 3.10 上根本装不上这个项目(shared/version_check.py 也会直接拒绝),
        # 为它保持兼容只是白费力气;要改支持范围就两处一起改。
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pynput httpx numpy pydantic websockets uvicorn fastapi pytest-asyncio python-multipart

      - name: Run tests (Ubuntu with Xvfb)
        if: matrix.os == 'ubuntu-latest'
        run: |
          xvfb-run --auto-servernum pytest tests/ -v --tb=short -m "not integration"

      - name: Run tests
        if: matrix.os != 'ubuntu-latest'
        run: |
          pytest tests/ -v --tb=short -m "not integration"

      - name: Run linting
        run: |
          pip install black ruff
          # F 类(未定义/未使用等真实错误)严格;扩展风格规则为既有债务,渐进清理
          ruff check client/ server/ shared/ tests/ services/ --select F

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install black ruff mypy

      - name: Run black
        run: |
          # 核心模块格式检查(既有旧客户端文件债务待后续清理)
          black --check services/ shared/ tests/ client/network.py client/app.py client/config_manager.py

      - name: Run ruff
        run: |
          # F 类真实错误严格(无 || true);风格规则为既有债务
          ruff check client/ server/ shared/ tests/ services/ --select F

  setup-env:
    # 建环境脚本本身没人测过:Windows 的 .ps1 在开发机(macOS)上根本跑不了,
    # `-Llm` 在没有 C++ 工具链的 Windows 上必失败这件事,是用户实测才发现的。
    # 这里在干净的 runner 上真跑一遍(CPU 版 torch + 预编译的 llama-cpp-python),
    # 再确认装出来的环境里 LLM 后处理的后端确实可用。
    name: setup-env on ${{ matrix.os }} (with LLM deps)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Run setup-env.sh
        if: runner.os != 'Windows'
        run: scripts/setup-env.sh --backend cpu --llm

      - name: Run setup-env.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\setup-env.ps1 -Backend cpu -Llm

      - name: LLM backend is usable in the environment it built
        shell: bash
        run: |
          # 脚本在 LLM 依赖装不上时会退回「不带它再装一遍」并以 0 退出,所以光看
          # 退出码不够,要确认 llama_cpp 真的能 import、后端选得出来。
          if [ -x .venv/Scripts/python.exe ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" - <<'PY'
          import llama_cpp, torch
          from shared import llm_backend

          backend, why = llm_backend.choose_backend(False)
          assert (backend, why) == ("llamacpp", None), (backend, why)
          print("llama_cpp", llama_cpp.__version__, "| torch", torch.__version__)
          print(llama_cpp.llama_print_system_info().decode(errors="replace"))
          PY

  rust-logic:
    name: Rust STT client logic tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run stt-logic-tests (no tauri/system deps needed)
        run: |
          cd gui/stt-logic-tests
          cargo test

  pyright:
    name: Pyright type check (client app contract)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps (for import resolution)
        run: |
          pip install --upgrade pip
          pip install PySimpleGUI pynput sounddevice numpy pyautogui

      - name: Run pyright on client app
        run: |
          npx -y pyright@latest client/app.py client/network.py 2>&1 \
            | grep -E "error:" \
            | grep -vE "reportMissingImports|reportMissingModuleSource|reportOptionalMemberAccess|reportUnknown" \
            && exit 1 || exit 0
