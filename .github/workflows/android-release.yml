name: Android release

# 发 Android 输入法的正式 APK:推一个形如 mobile-v0.1.0 的标签就会触发。
# 桌面端用 v* 标签(build-release.yml),这里特意用不同的前缀,两边版本号互不牵连。
#
# 需要四个 GitHub secrets(生成方法见 mobile/README.md 的「发布」一节):
#   ANDROID_KEYSTORE_BASE64  发布密钥库(.jks)的 base64
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#
# 产物是一个用发布密钥签名的 APK,挂在这个标签的 GitHub Release 上。
# IzzyOnDroid 会自动从 Release 里拉取;用户也可以用 Obtainium 直接跟这个仓库的 Release 更新。
on:
  push:
    tags:
      - 'mobile-v*'

permissions:
  contents: write   # 创建 Release、上传 APK

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 标签里的版本要和 build.gradle.kts 里的 versionName 一致,否则发出去的包和标签对不上。
      - name: Check the tag matches versionName
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME#mobile-v}"
          gradle_version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' mobile/android/app/build.gradle.kts)
          echo "tag=$tag_version gradle=$gradle_version"
          if [ "$tag_version" != "$gradle_version" ]; then
            echo "::error::标签是 $GITHUB_REF_NAME,但 build.gradle.kts 里的 versionName 是 $gradle_version。先改一致再重新打标签。"
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      - name: Restore the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$ANDROID_KEY_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$ANDROID_KEY_PASSWORD" ] || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::缺少 GitHub secrets:$missing。生成方法见 mobile/README.md 的「发布」一节。"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build the signed release APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      # 签名真的生效了才往下走:未签名的 release APK 装不上,发出去等于坏包。
      - name: Verify the signature
        id: apk
        run: |
          apk=$(ls mobile/android/app/build/outputs/apk/release/*.apk | head -1)
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
          out="voice-input-android-${{ steps.version.outputs.version }}.apk"
          cp "$apk" "$out"
          sha256sum "$out" | tee "$out.sha256"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          # 0.x 是初版,标成预发布。
          case "${{ steps.version.outputs.version }}" in 0.*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $flags \
            --title "Android 输入法 ${{ steps.version.outputs.version }}" \
            --notes "语音输入 Android 输入法 ${{ steps.version.outputs.version }}。用发布密钥签名的 APK;SHA-256 见同名 .sha256 文件。安装和使用见 mobile/README.md。" \
            "${{ steps.apk.outputs.file }}" "${{ steps.apk.outputs.file }}.sha256"
