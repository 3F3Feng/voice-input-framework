name: Build Tauri Client
on:
  push:
    branches: [dev/llm-postprocessing-v2, main, review/architecture-notes]
    tags-ignore: ['**']
    paths:
      - 'gui/**'
      - '.github/workflows/build.yml'
  # 不限定 base 分支:任何改动到 gui/ 的 PR 都要构建一次。保留 paths 过滤,
  # 这样不碰 GUI 的 PR 不会白跑一轮 30 分钟的 Tauri 构建。
  pull_request:
    paths:
      - 'gui/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install npm dependencies
        working-directory: gui
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libxdo-dev \
            libxtst-dev

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        id: build
        with:
          projectPath: gui
          bundleIdentifier: com.voiceinput.app
          tauriScript: npm run tauri
          # 这条流水线只是编译冒烟测试,产物 30 天后就删,没人安装 —— 不需要
          # 更新器产物,所以把 tauri.conf.json 里的 createUpdaterArtifacts 覆盖掉。
          #
          # 这不只是省事:开着它而配置里又有 updater pubkey,tauri 就**要求**
          # TAURI_SIGNING_PRIVATE_KEY,没有就直接报错。而 PR 如果来自 fork,
          # GitHub 不会把 secrets 给它 —— 那样每个外部 PR 都会红。发布签名只在
          # 真正发版的 build-release.yml 里做,那里也有密钥对不对得上的校验。
          args: --target ${{ matrix.target }} --config src-tauri/tauri.no-updater.conf.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-input-${{ matrix.target }}
          path: |
            gui/src-tauri/target/${{ matrix.target }}/release/bundle/**/*
            gui/src-tauri/target/release/bundle/**/*
          if-no-files-found: error
          retention-days: 30
