name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Python Client (Windows + macOS) ──
  build-python-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $versionLine = Select-String -Path "client/__init__.py" -Pattern '__version__\s*=\s*"([^"]+)"'
          $version = $versionLine.Matches.Groups[1].Value
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Version: $version"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install numpy pynput sounddevice websockets httpx pyautogui pyperclip PySimpleGUI pystray Pillow winotify

      - name: Build with PyInstaller
        shell: bash
        run: |
          version="${{ steps.version.outputs.VERSION }}"
          pyinstaller --name "VoiceInput-v$version" --windowed --onefile \
            --add-data "client;client" --add-data "shared;shared" \
            --hidden-import=client.hotkey_manager --hidden-import=client.tray_manager \
            --hidden-import=client.floating_indicator --hidden-import=client.config_manager \
            --hidden-import=client.notifier --hidden-import=client.update_checker \
            --hidden-import=shared.data_types --hidden-import=shared.protocol \
            --hidden-import=numpy --hidden-import=pynput --hidden-import=pynput.keyboard \
            --hidden-import=pynput.keyboard._win32 --hidden-import=pynput.mouse \
            --hidden-import=sounddevice --hidden-import=websockets --hidden-import=websockets.client \
            --hidden-import=httpx --hidden-import=httpx._client --hidden-import=httpcore \
            --hidden-import=pyautogui --hidden-import=pyperclip --hidden-import=PySimpleGUI \
            --hidden-import=h11 --hidden-import=certifi --hidden-import=pystray \
            --hidden-import=PIL --hidden-import=PIL.Image --hidden-import=winotify \
            --collect-all=numpy --collect-all=pynput --collect-all=sounddevice \
            --collect-all=websockets --collect-all=httpx --collect-all=PIL \
            run_client.py

      - name: Rename output
        shell: bash
        run: |
          version="${{ steps.version.outputs.VERSION }}"
          src="dist/VoiceInput-v${version}.exe"
          dst="dist/VoiceInput-v${version}-windows-x64.exe"
          if [ -f "$src" ]; then mv "$src" "$dst"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: python-windows
          path: dist/*.exe

  build-python-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get version
        id: version
        run: |
          version=$(python3 -c "import re; content=open('client/__init__.py').read(); m=re.search(r'__version__\s*=\s*[\"]([^\"]+)[\"]', content); print(m.group(1) if m else 'unknown')")
          echo "VERSION=$version" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install numpy pynput sounddevice websockets httpx pyautogui pyperclip PySimpleGUI pystray Pillow

      - name: Build with PyInstaller
        run: |
          version="${{ steps.version.outputs.VERSION }}"
          pyinstaller --name "VoiceInput-v$version" --windowed --onefile \
            --add-data "client:client" --add-data "shared:shared" \
            --hidden-import=client.hotkey_manager --hidden-import=client.tray_manager \
            --hidden-import=client.floating_indicator --hidden-import=client.config_manager \
            --hidden-import=client.notifier --hidden-import=client.update_checker \
            --hidden-import=shared.data_types --hidden-import=shared.protocol \
            --hidden-import=numpy --hidden-import=pynput --hidden-import=pynput.keyboard \
            --hidden-import=sounddevice --hidden-import=websockets --hidden-import=websockets.client \
            --hidden-import=httpx --hidden-import=httpx._client --hidden-import=httpcore \
            --hidden-import=pyautogui --hidden-import=pyperclip --hidden-import=PySimpleGUI \
            --hidden-import=h11 --hidden-import=certifi --hidden-import=pystray \
            --hidden-import=PIL --hidden-import=PIL.Image \
            --collect-all=numpy --collect-all=pynput --collect-all=sounddevice \
            --collect-all=websockets --collect-all=httpx --collect-all=PIL \
            run_client.py

      - name: Rename output
        run: |
          version="${{ steps.version.outputs.VERSION }}"
          src="dist/VoiceInput-v$version"
          dst="dist/VoiceInput-v$version-macos-x64"
          if [ -f "$src" ]; then mv "$src" "$dst"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: python-macos
          path: dist/*

  # ── Tauri GUI Client (Windows + macOS + Linux) ──
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install npm dependencies
        working-directory: gui
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libayatana-appindicator3-dev libasound2-dev libxdo-dev libxtst-dev

      - name: Build Tauri app
        working-directory: gui
        run: npx tauri build --target ${{ matrix.target }}

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $content = Get-Content "gui/src-tauri/tauri.conf.json" -Raw
          if ($content -match '"version"\s*:\s*"([^"]+)"') {
            $version = $matches[1]
          } else {
            $version = "0.0.0"
          }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Version: $version"

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          version="${{ steps.version.outputs.VERSION }}"
          if [ -d "gui/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle" ]; then
            find gui/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle -name "*.deb" -exec cp {} dist/ \;
            find gui/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle -name "*.AppImage" -exec cp {} dist/ \;
          fi
          if [ -d "gui/src-tauri/target/aarch64-apple-darwin/release/bundle" ]; then
            find gui/src-tauri/target/aarch64-apple-darwin/release/bundle -name "*.dmg" -exec cp {} dist/ \;
          fi
          if [ -d "gui/src-tauri/target/x86_64-pc-windows-msvc/release/bundle" ]; then
            find gui/src-tauri/target/x86_64-pc-windows-msvc/release/bundle -name "*setup*.exe" -exec cp {} dist/ \;
          fi
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.os }}
          path: dist/*

  # ── Create Release ──
  release:
    needs: [build-python-windows, build-python-macos, build-tauri]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$version" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List all files
        run: find release-assets -type f | sort

      - name: Rename assets for clarity
        run: |
          cd release-assets
          version="${{ steps.version.outputs.VERSION }}"
          # Rename all files with clear prefixes
          for f in */*; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            if [[ "$base" == *".deb" ]]; then
              mv "$f" "GUI-Linux-${version}-x64.deb"
            elif [[ "$base" == *".AppImage" ]]; then
              mv "$f" "GUI-Linux-${version}-x64.AppImage"
            elif [[ "$base" == *".dmg" ]]; then
              mv "$f" "GUI-macOS-${version}-aarch64.dmg"
            elif [[ "$base" == *"setup"*".exe" ]]; then
              mv "$f" "GUI-Windows-${version}-x64.exe"
            elif [[ "$base" == *".msi" ]]; then
              rm "$f"
            elif [[ "$base" == *"windows"* ]]; then
              mv "$f" "GUI-Python-Windows-${version}-x64.exe"
            elif [[ "$base" == *"macos"* ]]; then
              mv "$f" "GUI-Python-macOS-${version}-x64"
            fi
          done
          # Remove extra files
          rm -f CodeResources icon-windowed.icns Info.plist VoiceInput-v* 2>/dev/null || true
          # Flatten
          find . -mindepth 2 -type f -exec mv {} . \; 2>/dev/null || true
          rm -rf tauri-* python-* 2>/dev/null || true
          ls -la

      - name: Generate latest.json for Tauri updater
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ls -la release-assets/
          python3 scripts/generate_latest_json.py
          ls -la release-assets/latest.json

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          body: |
            ## Voice Input Framework v${{ steps.version.outputs.VERSION }}

            ### 🖥️ Tauri GUI 客户端（推荐，原生跨平台）
            | 平台 | 文件 |
            |------|------|
            | Windows | `GUI-Windows-${{ steps.version.outputs.VERSION }}-x64.exe` |
            | macOS | `GUI-macOS-${{ steps.version.outputs.VERSION }}-aarch64.dmg` |
            | Linux | `GUI-Linux-${{ steps.version.outputs.VERSION }}-x64.deb` / `.AppImage` |

            ### 🐍 Python GUI 客户端（PySimpleGUI）
            | 平台 | 文件 |
            |------|------|
            | Windows | `GUI-Python-Windows-${{ steps.version.outputs.VERSION }}-x64.exe` |
            | macOS | `GUI-Python-macOS-${{ steps.version.outputs.VERSION }}-x64` |

            ### ✨ 功能
            - 按住说话，支持全局快捷键
            - 实时流式音频传输
            - LLM 后处理（可选）
            - 多模型支持：Qwen3-ASR、Whisper
            - 跨平台：Windows、macOS、Linux

            ### 📋 服务端要求
            - STT 服务运行在 `localhost:6544`
            - LLM 服务运行在 `localhost:6545`（可选）
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
