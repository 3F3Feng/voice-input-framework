name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Python Client (Windows + macOS) ──
  build-python-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $versionLine = Select-String -Path "client/__init__.py" -Pattern '__version__\s*=\s*"([^"]+)"'
          $version = $versionLine.Matches.Groups[1].Value
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Version: $version"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install numpy pynput sounddevice websockets httpx pyautogui pyperclip PySimpleGUI pystray Pillow winotify

      - name: Build with PyInstaller
        shell: bash
        run: |
          version="${{ steps.version.outputs.VERSION }}"
          pyinstaller --name "VoiceInput-v$version" --windowed --onefile \
            --add-data "client;client" --add-data "shared;shared" \
            --hidden-import=client.hotkey_manager --hidden-import=client.tray_manager \
            --hidden-import=client.floating_indicator --hidden-import=client.config_manager \
            --hidden-import=client.notifier --hidden-import=client.update_checker \
            --hidden-import=shared.data_types --hidden-import=shared.protocol \
            --hidden-import=numpy --hidden-import=pynput --hidden-import=pynput.keyboard \
            --hidden-import=pynput.keyboard._win32 --hidden-import=pynput.mouse \
            --hidden-import=sounddevice --hidden-import=websockets --hidden-import=websockets.client \
            --hidden-import=httpx --hidden-import=httpx._client --hidden-import=httpcore \
            --hidden-import=pyautogui --hidden-import=pyperclip --hidden-import=PySimpleGUI \
            --hidden-import=h11 --hidden-import=certifi --hidden-import=pystray \
            --hidden-import=PIL --hidden-import=PIL.Image --hidden-import=winotify \
            --collect-all=numpy --collect-all=pynput --collect-all=sounddevice \
            --collect-all=websockets --collect-all=httpx --collect-all=PIL \
            run_client.py

      - name: Rename output
        shell: bash
        run: |
          version="${{ steps.version.outputs.VERSION }}"
          src="dist/VoiceInput-v${version}.exe"
          dst="dist/VoiceInput-v${version}-windows-x64.exe"
          if [ -f "$src" ]; then mv "$src" "$dst"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: python-windows
          path: dist/*.exe
          if-no-files-found: error

  build-python-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get version
        id: version
        run: |
          version=$(python3 -c "import re; content=open('client/__init__.py').read(); m=re.search(r'__version__\s*=\s*[\"]([^\"]+)[\"]', content); print(m.group(1) if m else 'unknown')")
          echo "VERSION=$version" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install numpy pynput sounddevice websockets httpx pyautogui pyperclip PySimpleGUI pystray Pillow

      - name: Build with PyInstaller
        run: |
          version="${{ steps.version.outputs.VERSION }}"
          pyinstaller --name "VoiceInput-v$version" --windowed --onefile \
            --add-data "client:client" --add-data "shared:shared" \
            --hidden-import=client.hotkey_manager --hidden-import=client.tray_manager \
            --hidden-import=client.floating_indicator --hidden-import=client.config_manager \
            --hidden-import=client.notifier --hidden-import=client.update_checker \
            --hidden-import=shared.data_types --hidden-import=shared.protocol \
            --hidden-import=numpy --hidden-import=pynput --hidden-import=pynput.keyboard \
            --hidden-import=sounddevice --hidden-import=websockets --hidden-import=websockets.client \
            --hidden-import=httpx --hidden-import=httpx._client --hidden-import=httpcore \
            --hidden-import=pyautogui --hidden-import=pyperclip --hidden-import=PySimpleGUI \
            --hidden-import=h11 --hidden-import=certifi --hidden-import=pystray \
            --hidden-import=PIL --hidden-import=PIL.Image \
            --collect-all=numpy --collect-all=pynput --collect-all=sounddevice \
            --collect-all=websockets --collect-all=httpx --collect-all=PIL \
            run_client.py

      - name: Rename output
        run: |
          version="${{ steps.version.outputs.VERSION }}"
          src="dist/VoiceInput-v$version"
          dst="dist/VoiceInput-v$version-macos-x64"
          if [ -f "$src" ]; then mv "$src" "$dst"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: python-macos
          # 只要重命名后的那个单文件。用 `dist/*` 会把 pyinstaller 在 macOS 上
          # 顺带产出的 VoiceInput-v<ver>.app 包整个收走,摊平之后包里的
          # CodeResources / Info.plist / icon-windowed.icns / 可执行文件就成了
          # release 资产 —— v2.0.10 的 release 里这四个至今还挂着。
          path: dist/VoiceInput-v${{ steps.version.outputs.VERSION }}-macos-x64
          if-no-files-found: error

  # ── Tauri GUI Client (Windows + macOS + Linux) ──
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install npm dependencies
        working-directory: gui
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libayatana-appindicator3-dev libasound2-dev libxdo-dev libxtst-dev

      # macOS 发布包必须用固定证书签名。
      #
      # macOS 的隐私权限(麦克风 / 输入监控 / 辅助功能)按**代码签名身份**记录授权。
      # 不带证书时 Tauri 只做 ad-hoc 签名,身份就是这次构建的 cdhash,每次发版都变:
      # 用户点「更新」装上新版后,系统设置里 Voice Input 的开关还开着,授权却对不上
      # 新的二进制,快捷键和自动输入悄悄失效(v2.3.0 就是这样发出去的)。
      # 用证书签名后,身份是「bundle id + 证书名」,跨版本不变,授权一次长期有效。
      #
      # 缺 secret 时直接失败,而不是退回 ad-hoc 照常发版。怎么配见
      # docs/macos-signed-build.md 的「发版签名」一节。
      - name: Check macOS signing secrets
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          missing=""
          [ -n "$APPLE_CERTIFICATE" ] || missing="$missing APPLE_CERTIFICATE"
          [ -n "$APPLE_CERTIFICATE_PASSWORD" ] || missing="$missing APPLE_CERTIFICATE_PASSWORD"
          [ -n "$APPLE_SIGNING_IDENTITY" ] || missing="$missing APPLE_SIGNING_IDENTITY"
          if [ -n "$missing" ]; then
            echo "::error::缺少 macOS 签名用的 secret:$missing。不签名发出去的包会让用户每次更新都丢掉系统权限,见 docs/macos-signed-build.md「发版签名」。"
            exit 1
          fi

      # 证书导进我们自己建的钥匙串,整个 job 都在。
      #
      # 不能让 Tauri 自己导(给它 APPLE_CERTIFICATE):它签完 .app 就把临时钥匙串
      # 删了,紧接着打 .dmg 时 bundle_dmg.sh 要用同一个身份签 dmg,找不到证书,
      # 整个构建失败(实测)。这里导好之后只告诉 Tauri 身份名(APPLE_SIGNING_IDENTITY)。
      - name: Import macOS signing certificate
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/vif-signing.keychain-db"
          keychain_pw="$(openssl rand -hex 24)"
          cert="$RUNNER_TEMP/vif-signing.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$cert"
          security create-keychain -p "$keychain_pw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pw" "$keychain"
          security import "$cert" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$cert"
          # 不设分区列表的话,codesign 每次取私钥都要弹「允许访问钥匙串」,CI 上没人点。
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_pw" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"

      - name: Build Tauri app
        working-directory: gui
        # 签名密钥必须传进来。少了它 `createUpdaterArtifacts: true` 会直接让构建
        # 失败——这是好事:以前的做法是密钥只挂在 build.yml(那条流水线的产物 30 天
        # 后就删,没人安装),真正出 release 的这条反而没有,于是每次发版都没有 .sig,
        # latest.json 里三个平台的 signature 全是空串。客户端配了 pubkey,空签名
        # 一律验不过——用户点「下载安装」永远失败,而且失败得毫无线索。
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 只有 macOS 用得上:证书已经在上一步导进钥匙串,这里只给身份名。
          # 没设 APPLE_ID 等公证用的变量,所以不会去公证。
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY || '' }}
        run: |
          set -o pipefail
          verbose=""
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            # --verbose 才会把 bundle_dmg.sh 等打包脚本的输出打出来,出错时有线索。
            verbose="--verbose"
          else
            # 空字符串的 APPLE_SIGNING_IDENTITY 也算「设了」,清掉。
            unset APPLE_SIGNING_IDENTITY
          fi
          npx tauri build --target ${{ matrix.target }} $verbose 2>&1 | tee build.log

          # 私钥和配置里的 pubkey 对不上时,tauri 只**警告**一句就照常出包:
          #   "The updater secret key from `TAURI_SIGNING_PRIVATE_KEY` does not
          #    match the public key from `plugins > updater > pubkey`"
          # 那样发出去的签名每一个客户端都验不过,而发版这边一路绿灯,要等用户
          # 点了更新失败才发现。在这里把它升级成硬失败。
          if grep -q "does not match the public key" build.log; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY 和 tauri.conf.json 里的 updater pubkey 不是一对,签出来的更新包客户端一个都验不过。"
            exit 1
          fi

      # 签完再验一遍:证书真的用上了、身份不是 cdhash、麦克风 entitlement 在。
      # 真证书签名会打开 hardened runtime,那时少了 device.audio-input,麦克风会被
      # 系统直接拒绝(不弹窗、不进设置列表),比不签名还难查。
      - name: Verify macOS signature
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          app="gui/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Voice Input.app"
          info="$(codesign -dv --verbose=2 "$app" 2>&1 || true)"
          req="$(codesign -d -r- "$app" 2>&1 || true)"
          echo "$info"; echo "$req"
          codesign --verify --deep --strict "$app"
          echo "$info" | grep -q '^Identifier=com.voiceinput.app$' \
            || { echo "::error::签名的 identifier 不是 com.voiceinput.app"; exit 1; }
          echo "$info" | grep -q '^Authority=' \
            || { echo "::error::没有用证书签名(仍是 ad-hoc)"; exit 1; }
          if echo "$req" | grep -q 'cdhash'; then
            echo "::error::designated requirement 还是 cdhash,每次发版身份都会变"; exit 1
          fi
          codesign -d --entitlements - --xml "$app" 2>/dev/null | grep -q 'com.apple.security.device.audio-input' \
            || { echo "::error::签名里没有 device.audio-input entitlement,hardened runtime 下麦克风会被直接拒绝"; exit 1; }
          # 更新器装的是 .app.tar.gz,确认里面的也是签过名的那一份。
          tmp="$(mktemp -d)"
          tar -xzf "$(dirname "$app")/Voice Input.app.tar.gz" -C "$tmp"
          codesign -dv "$tmp/Voice Input.app" 2>&1 | grep -q '^Authority=' \
            || { echo "::error::.app.tar.gz 里的 app 没有证书签名"; exit 1; }

      # 这里原本有一步从 tauri.conf.json 里正则抠 version,抠不到就退回 "0.0.0"。
      # 版本号现在只写在 gui/src-tauri/Cargo.toml 里(Tauri 缺省回落到它),
      # tauri.conf.json 已经没有 version 字段,所以那一步只会稳定产出 "0.0.0";
      # 而它抠出来的值下面压根没被用到。整步删掉,版本号由 release job 从 tag 取。

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          bundle="gui/src-tauri/target/${{ matrix.target }}/release/bundle"
          [ -d "$bundle" ] || { echo "没有 bundle 目录: $bundle"; exit 1; }

          # 给人下载的安装包
          find "$bundle" \( -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" \
                          -o -name "*setup*.exe" \) -exec cp {} dist/ \;

          # 自动更新用的产物和签名。每个平台的形状都不一样,是实际跑了一遍
          # 三平台构建看出来的,别照着直觉猜:
          #   macOS   → Voice Input.app.tar.gz + .sig   (不是 .dmg,更新器装不了 dmg)
          #   Linux   → ...amd64.AppImage + .sig        (**没有** .AppImage.tar.gz,
          #                                              AppImage 本体就是更新产物)
          #           → ...amd64.deb + .sig             (用 deb 装的用户走这条)
          #   Windows → ...x64-setup.exe + .sig         (NSIS 安装器本体就是更新产物)
          # 上面收安装包那一步已经把 AppImage / deb / setup.exe 拿到了,这里只补
          # macOS 的 tar.gz 和所有签名。
          #
          # 注意 `-name "*.app.tar.gz"` 不能写成 `*.tar.gz`:Linux 的 bundle 目录里
          # 还躺着 deb 拆出来的 control.tar.gz 和 data.tar.gz(7MB),一并收走的话
          # 它们会被当成 release 资产发出去。
          find "$bundle" \( -name "*.app.tar.gz" -o -name "*.sig" \) -exec cp {} dist/ \;

          # 扔掉「主文件没被收进来」的孤儿签名。`targets: "all"` 在 Windows 上还会
          # 出 .msi、在 Linux 上还会出 .rpm,它们各自带一个 .sig;上面按名字只收了
          # 要发的那几个安装包,签名却是一把抓的。不清掉的话,release 里会挂着几个
          # 谁也用不上的 .sig。
          for sig in dist/*.sig; do
            [ -e "$sig" ] || continue
            [ -e "${sig%.sig}" ] || { echo "丢弃孤儿签名: $(basename "$sig")"; rm -f "$sig"; }
          done

          echo "── dist ──"; ls -la dist/
          if ! ls dist/*.sig >/dev/null 2>&1; then
            echo "::error::没有生成任何 .sig,自动更新会装不上。检查 TAURI_SIGNING_PRIVATE_KEY 和 bundle.createUpdaterArtifacts。"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.os }}
          path: dist/*

  # ── Create Release ──
  release:
    needs: [build-python-windows, build-python-macos, build-tauri]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$version" >> $GITHUB_OUTPUT

          # tag 是唯一决定产物叫什么名字的东西,但**决定客户端自认为是哪个版本的
          # 是 Cargo.toml**(Tauri 从它取 version,更新器拿它和 latest.json 比)。
          # 两者不一致,自动更新就会错乱:比如 tag 打成 v2.3.0 而 Cargo.toml 还是
          # 2.2.0,装上去的客户端自报 2.2.0,于是每次启动都发现「有新版本 2.3.0」,
          # 下载装完还是 2.2.0——无限提示更新。所以这里挡住。
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' gui/src-tauri/Cargo.toml | head -1)"
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::tag v$version 和 gui/src-tauri/Cargo.toml 的 $cargo_version 对不上。发版前先改 Cargo.toml(版本号唯一来源)。"
            exit 1
          fi

          # Python 老客户端自己带一个 __version__,产物文件名按 tag 改过所以看不出来,
          # 但它是编进二进制里的:v2.0.10 那次发版里就混进了一个 VoiceInput-v2.0.0。
          py_version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' client/__init__.py | head -1)"
          if [ "$version" != "$py_version" ]; then
            echo "::error::tag v$version 和 client/__init__.py 的 $py_version 对不上。"
            exit 1
          fi
          echo "版本号一致: $version"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List all files
        run: find release-assets -type f | sort

      - name: Rename assets for clarity
        run: |
          set -euo pipefail
          cd release-assets
          version="${{ steps.version.outputs.VERSION }}"

          # **先摊平,再改名,最后清垃圾。** 顺序不是随手排的:原来是「改名 → 清垃圾
          # → 摊平」,而清垃圾那一步在根目录执行,垃圾那时还躺在 tauri-macos-latest/
          # 里面,摊平之后就再没人清了。v2.0.10 的 release 里因此挂着 CodeResources、
          # Info.plist、icon-windowed.icns、VoiceInput-v2.0.0 四个文件
          # (pyinstaller 在 macOS 上除了单文件还会产出一个 .app 包,upload-artifact
          #  的 `path: dist/*` 把包里的内容一并收走了)。
          find . -mindepth 2 -type f -exec mv -n {} . \;
          find . -mindepth 1 -type d -exec rm -rf {} + 2>/dev/null || true

          # pyinstaller 的 .app 包内容,不该出现在 release 资产里
          rm -f CodeResources Info.plist PkgInfo icon-windowed.icns

          # 改名时必须把 .sig 一起带走,否则 latest.json 就和签名配不上对了。
          ren() {
            mv "$1" "$2"
            [ -f "$1.sig" ] && mv "$1.sig" "$2.sig"
            return 0
          }

          for f in *; do
            [ -f "$f" ] || continue
            case "$f" in
              # 签名由 ren() 跟着主文件一起改,这里跳过,免得改两次
              *.sig) continue ;;
              # 更新器产物。macOS 更新器吃的是 .app.tar.gz,Linux 是 .AppImage.tar.gz;
              # 这两条必须排在 *.AppImage / *.dmg 前面之外,还要排在任何 *.tar.gz 前面。
              # macOS 的更新产物是独立的一个 tar.gz;Linux / Windows 则是安装包
              # 本体兼做更新产物,所以下面 .AppImage / .deb / setup.exe 三条既是
              # 给人下载的,也是 latest.json 指向的。ren() 会把 .sig 一起带走。
              *.app.tar.gz)      ren "$f" "GUI-macOS-${version}-aarch64.app.tar.gz" ;;
              *.deb)             ren "$f" "GUI-Linux-${version}-x64.deb" ;;
              *.AppImage)        ren "$f" "GUI-Linux-${version}-x64.AppImage" ;;
              *.dmg)             ren "$f" "GUI-macOS-${version}-aarch64.dmg" ;;
              *setup*.exe)       ren "$f" "GUI-Windows-${version}-x64.exe" ;;
              *.msi)             rm -f "$f" "$f.sig" ;;
              *windows*)         ren "$f" "GUI-Python-Windows-${version}-x64.exe" ;;
              *macos*)           ren "$f" "GUI-Python-macOS-${version}-x64" ;;
            esac
          done
          ls -la

      - name: Generate latest.json for Tauri updater
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ls -la release-assets/
          python3 scripts/generate_latest_json.py
          ls -la release-assets/latest.json

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          body: |
            ## Voice Input Framework v${{ steps.version.outputs.VERSION }}

            ### 🖥️ Tauri GUI 客户端（推荐，原生跨平台）
            | 平台 | 文件 |
            |------|------|
            | Windows | `GUI-Windows-${{ steps.version.outputs.VERSION }}-x64.exe` |
            | macOS | `GUI-macOS-${{ steps.version.outputs.VERSION }}-aarch64.dmg` |
            | Linux | `GUI-Linux-${{ steps.version.outputs.VERSION }}-x64.deb` / `.AppImage` |

            ### 🐍 Python GUI 客户端（PySimpleGUI）
            | 平台 | 文件 |
            |------|------|
            | Windows | `GUI-Python-Windows-${{ steps.version.outputs.VERSION }}-x64.exe` |
            | macOS | `GUI-Python-macOS-${{ steps.version.outputs.VERSION }}-x64` |

            ### ✨ 功能
            - 按住说话，支持全局快捷键
            - 实时流式音频传输
            - LLM 后处理（可选）
            - 多模型支持：Qwen3-ASR、Whisper
            - 跨平台：Windows、macOS、Linux

            ### 🔄 自动更新
            客户端会在启动时检查更新,也可以在「设置 → 关于」里手动检查。
            更新包由 minisign 签名,签名验不过就不会安装。

            > **macOS 首次安装**:这个 `.dmg` 没有经过 Apple 公证,第一次打开会提示
            > 「已损坏,无法打开」。这是 Gatekeeper 的隔离属性,不是文件真的坏了:
            > 装进「应用程序」后执行一次
            > `xattr -dr com.apple.quarantine "/Applications/Voice Input.app"` 即可。
            > 装好之后的**自动更新不受影响**——更新包是客户端自己下载并原地替换的,
            > 不会再被打上隔离属性。想完全避开这一步,可以用仓库里的
            > `scripts/build-macos.sh` 自己签名构建(见 `docs/macos-signed-build.md`)。

            ### 📋 服务端要求
            - STT 服务运行在 `localhost:6544`
            - LLM 服务运行在 `localhost:6545`（可选）
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
