repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        name: ruff check (Python lint)
        args: [--fix]
        files: ^(client/|server/|services/|shared/)
      - id: ruff-format
        name: ruff format (Python fmt)
        files: ^(client/|server/|services/|shared/)

  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: clippy
        name: clippy (Rust lint)
        args: [--manifest-path=gui/src-tauri/Cargo.toml, --all-targets, --all-features, --, -D, warnings]
        files: ^gui/src-tauri/
      - id: fmt
        name: rustfmt (Rust fmt)
        args: [--manifest-path, gui/src-tauri/Cargo.toml]
        files: ^gui/src-tauri/
