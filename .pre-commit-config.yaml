# Pre-commit hooks — 推送前本地 lint 保障(与 .github/workflows/ci.yml 的
# Lint job 规则一致:ruff --select F + black --check 核心路径)
#
# 安装:
#   pip install pre-commit
#   pre-commit install
# 手动跑(可选):
#   pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      # 与 CI Lint job 相同:ruff --select F(undefined-name/import 类错误)
      - id: ruff
        args: [--fix, --select, F]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3
        # 与 CI black --check 的核心路径一致
        files: ^(services/|shared/|client/|tests/)
