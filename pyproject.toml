[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-input-framework"
version = "2.2.0"
description = "Voice Input Framework - 跨平台语音识别与 LLM 后处理"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.13"
authors = [
    {name = "OpenClaw", email = "openclaw@example.com"}
]
keywords = ["voice", "stt", "speech-to-text", "whisper", "mlx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "httpx>=0.26.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    # numpy 锁 1.x:2.x 的 C-API 破坏性变更会和为 1.x 编译的二进制冲突
    # (报 _ARRAY_API not found)
    "numpy>=1.26.4,<2.0",
    "scipy>=1.12.0",
    "noisereduce>=3.0.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    # STT 两个引擎都要 transformers;torch 由下面的硬件 extra 指定来源
    "transformers>=4.37.0",
    # ── MLX:**只在 Apple Silicon 上装** ──
    # 这个 marker 是必须的,不是保险起见。mlx 现在确实为 Linux/Windows 发了
    # wheel,但 Linux x86_64 那个是残的:装得上,一 import 就
    # `ImportError: libmlx.so: cannot open shared object file`
    # (wheel 里有 core...so,没有它链接的那个库;能用的 Linux 版在另一个
    #  CUDA 包里)。在 Ubuntu 24.04 上实测过。
    # requirements-stt.txt 以前无条件列了 mlx / mlx-audio,所以照着 README
    # 在 Linux 上建环境,建出来就是坏的。
    "mlx>=0.31.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.31.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-audio>=0.4.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # whisper_mlx* 这组模型走的是 mlx-whisper,不是 mlx-audio。以前从没列进依赖
    # (老环境是手工装的),换成 uv 建环境后就没了:选 whisper_mlx 会在加载时报
    # `No module named 'mlx_whisper'`。
    "mlx-whisper>=0.4.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

# ── 按硬件选 torch 的来源 ──
#
# 这几个 extra 的依赖写的是同一个 torch,区别只在**从哪个源装**:
# PyTorch 为每种加速后端发的是不同的 wheel(CPU / CUDA / ROCm / XPU),
# 名字都叫 torch。下面 [tool.uv.sources] 把 extra 映射到对应的官方索引。
#
# 互斥,一次只能选一个(见 [tool.uv] 的 conflicts)。
#
# Apple Silicon 什么都不用选:PyPI 上的默认 torch 自带 MPS。
[project.optional-dependencies]
cpu = [
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
]
cuda = [
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
]
rocm = [
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    # torch 的 ROCm 版会拖这个配套 triton,而它只在 ROCm 索引上,PyPI 没有。
    # 不显式列出来,uv 不允许给它指定索引来源。ROCm 只有 Linux。
    "pytorch-triton-rocm; sys_platform == 'linux'",
]
xpu = [
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "pytorch-triton-xpu; sys_platform == 'linux'",
]
# 非 Apple 机器上的 LLM 后处理后端。MLX 只有 Apple Silicon 能跑,
# 别的平台用 llama.cpp 跑 GGUF(CPU 可用,也能编译出 CUDA/ROCm/Vulkan 版)。
llm-cpp = [
    "llama-cpp-python>=0.3.2",
    "huggingface-hub>=0.24.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[project.scripts]
voice-server = "services.stt_server:main"
voice-client = "run_client:main"

[tool.uv]
# 四个硬件 extra 装的是同一个包的不同 wheel,不能同时选
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
        { extra = "rocm" },
        { extra = "xpu" },
    ],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.2"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" },
    { index = "pytorch-rocm", extra = "rocm" },
    { index = "pytorch-xpu", extra = "xpu" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" },
    { index = "pytorch-rocm", extra = "rocm" },
    { index = "pytorch-xpu", extra = "xpu" },
]
# torch 的加速版还会拖一个配套的 triton 进来,而那些 triton **只在对应的
# PyTorch 索引上**,PyPI 上没有(或者只有对不上号的老版本)。索引设了
# explicit = true 就只服务这里点名的包,所以必须把它们也写上 —— 漏掉的话
# 解析会以一长串「triton-xpu==3.7.0 不存在」收场,这是实测踩到的。
pytorch-triton-xpu = [{ index = "pytorch-xpu", extra = "xpu" }]
pytorch-triton-rocm = [{ index = "pytorch-rocm", extra = "rocm" }]

[tool.setuptools.packages.find]
where = ["."]
include = ["voice_input_framework*"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# 仓库既有风格债(渐进式豁免;F 类真实错误仍严格)
ignore = [
    "E501",    # 行长(既有超长行)
    "E402",    # 模块级 import(项目用 sys.path 注入的惯用法)
    "E722",    # bare except(既有)
    "F841",    # 未用局部变量(既有)
    "BLE001",  # 盲捕 Exception(既有防御式代码)
    "S110",    # try-except-pass(既有)
    "S112",    # try-except-continue(既有)
    "G201",    # logger.error(exc_info=True) 建议(既有)
    "B008",    # FastAPI Form/File 默认参数(框架惯用法)
    "B023",    # loop 变量闭包(既有)
    "C401", "C414", "C416",  # 可读性简化建议(既有)
    "EXE001",  # shebang 文件无执行位(CI 环境差异)
    "RUF012",  # 类属性可变默认值(既有)
    "RUF013",  # 隐式 Optional(既有)
    "UP040", "UP035", "UP031", "UP045",  # typing 现代化(既有)
]

[tool.ruff.lint.per-file-ignores]
# 保留的旧客户端/既有文件:未使用导入等债务暂豁免(F 类真实错误待后续清理)
"client/gui.py" = ["F401", "F841"]
"client/gui_v1_backup.py" = ["F401", "F841"]  # v1 GUI 备份文件,不参与构建
"client/notifier.py" = ["F401"]
"client/ui.py" = ["F401"]
"client/cursor_tracker.py" = ["F841"]
"client/tests/test_cursor_tracker.py" = ["F841"]
"services/stt_server.py" = ["F401"]  # TranscriptionRequest re-export(测试从 stt_server 导入)

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
