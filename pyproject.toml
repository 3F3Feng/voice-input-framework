[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-input-framework"
version = "2.0.10"
description = "Voice Input Framework - MLX 原生语音识别"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.13"
authors = [
    {name = "OpenClaw", email = "openclaw@example.com"}
]
keywords = ["voice", "stt", "speech-to-text", "whisper", "mlx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "httpx>=0.26.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "noisereduce>=3.0.0",
    "rich>=13.7.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
stt = [
    "transformers>=4.37.0",
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
]
mlx = [
    "mlx>=0.31.0",
    "mlx-lm>=0.31.0",
    "mlx-audio>=0.4.2",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[project.scripts]
voice-server = "services.stt_server:main"
voice-client = "run_client:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["voice_input_framework*"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# 仓库既有风格债(渐进式豁免;F 类真实错误仍严格)
ignore = [
    "E501",    # 行长(既有超长行)
    "E402",    # 模块级 import(项目用 sys.path 注入的惯用法)
    "E722",    # bare except(既有)
    "F841",    # 未用局部变量(既有)
    "BLE001",  # 盲捕 Exception(既有防御式代码)
    "S110",    # try-except-pass(既有)
    "S112",    # try-except-continue(既有)
    "G201",    # logger.error(exc_info=True) 建议(既有)
    "B008",    # FastAPI Form/File 默认参数(框架惯用法)
    "B023",    # loop 变量闭包(既有)
    "C401", "C414", "C416",  # 可读性简化建议(既有)
    "EXE001",  # shebang 文件无执行位(CI 环境差异)
    "RUF012",  # 类属性可变默认值(既有)
    "RUF013",  # 隐式 Optional(既有)
    "UP040", "UP035", "UP031", "UP045",  # typing 现代化(既有)
]

[tool.ruff.lint.per-file-ignores]
# 保留的旧客户端/既有文件:未使用导入等债务暂豁免(F 类真实错误待后续清理)
"client/gui.py" = ["F401", "F841"]
"client/notifier.py" = ["F401"]
"client/ui.py" = ["F401"]
"client/cursor_tracker.py" = ["F841"]
"client/tests/test_cursor_tracker.py" = ["F841"]
"services/stt_server.py" = ["F401"]  # TranscriptionRequest re-export(测试从 stt_server 导入)

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
