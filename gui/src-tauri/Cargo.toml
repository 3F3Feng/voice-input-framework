[package]
name = "voice-input"
version = "2.3.0"
description = "Voice Input Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "voice_input_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
# 双开 = 两套全局快捷键监听,按一次录两遍。第二个实例只负责把第一个的窗口叫出来。
tauri-plugin-single-instance = "2"
# 托盘「复制最近一条结果」:窗口藏着时 webview 的 navigator.clipboard 不可靠,
# 只能从 Rust 侧写剪贴板。
tauri-plugin-clipboard-manager = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
enigo = { version = "0.2", default-features = false, features = ["default"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
rdev = "0.5"
base64 = "0.22"
# 客户端日志的本地时间戳。依赖树里本来就有(serde_with → chrono),不新增下载。
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# macOS 专用:CGEventTap 监听快捷键(替代 rdev——rdev 的 macOS 后端在
# 事件回调里调 TSMGetInputSourceProperty,macOS 15+ 非主线程调用会
# SIGTRAP 崩溃,与 Python 端 pynput 崩溃同源)
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"
core-foundation = "0.9"
# 麦克风权限(AVCaptureDevice 授权查询/申请)。输入监控与辅助功能用的是
# IOKit / ApplicationServices 的 C 符号,直接在 permissions.rs 里声明 FFI,
# 不额外引依赖。objc2 / block2 本来就在依赖树里(tauri → wry),此处只是显式引用。
objc2 = "0.6"
block2 = "0.6"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
