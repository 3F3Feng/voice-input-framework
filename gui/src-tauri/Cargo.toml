[package]
name = "voice-input"
version = "2.0.0"
description = "Voice Input Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "voice_input_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
enigo = { version = "0.2", default-features = false, features = ["default"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
rdev = "0.5"
base64 = "0.22"

# macOS 专用:CGEventTap 监听快捷键(替代 rdev——rdev 的 macOS 后端在
# 事件回调里调 TSMGetInputSourceProperty,macOS 15+ 非主线程调用会
# SIGTRAP 崩溃,与 Python 端 pynput 崩溃同源)
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"
core-foundation = "0.9"
